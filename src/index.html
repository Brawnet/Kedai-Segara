    <!-- Diganti oleh doGet() di Kode.gs menjadi "tablet" atau "admin". -->
    <script>
      window.SEGARA_MODE = '__SEGARA_MODE__';
      try {
        var t = localStorage.getItem('segara_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
